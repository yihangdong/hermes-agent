# Governed successor CI carrier: AI-Org #198 gates 5626694014 / 5626766264.
# Self-scoped labeled event only. R0 review precedes the single ci-reviewed
# label addition; source authors do not self-label. No opened/manual trigger.
# Existing workflow_call leaves are inlined at unchanged commands/action pins,
# inputs and per-job permission ceilings. Product/source blobs are frozen.
# Desktop E2E remains source-disabled; Python e2e and native OS lanes run.
# The OSV job below incorporates the pinned Google reusable workflow:
# Copyright 2023 Google LLC. Licensed under the Apache License, Version 2.0
# (the "License"); you may not use this file except in compliance with the
# License. You may obtain a copy at http://www.apache.org/licenses/LICENSE-2.0
# Unless required by applicable law or agreed to in writing, software
# distributed under the License is distributed on an "AS IS" BASIS, WITHOUT
# WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the
# License for the specific language governing permissions and limitations.

name: Stage-A recovery CI
'on':
  pull_request:
    types:
    - labeled
    branches:
    - dyhano/canonical-base-ff7745fb
    paths:
    - .github/workflows/stagea-recovery-ci.yml
permissions:
  contents: read
concurrency:
  group: stagea-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity:
    name: Bind labeled event and exact candidate
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name ==
      'ci-reviewed' && github.repository == 'yihangdong/hermes-agent' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
    - name: Validate exact object and record sanitized identity
      run: "python3 - <<'PY'\nimport hashlib, json, os, subprocess\nfrom pathlib import Path\ndef git(*args):\n\
        \    return subprocess.check_output(['git', *args], text=True).strip()\nevent = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())\n\
        pr = event['pull_request']\nhead, base = pr['head']['sha'], pr['base']['sha']\nassert event['action'] ==\
        \ 'labeled' and event['label']['name'] == 'ci-reviewed'\nassert event['repository']['full_name'] == 'yihangdong/hermes-agent'\n\
        assert pr['head']['repo']['full_name'] == 'yihangdong/hermes-agent'\nassert base == '2820750eccc6e9b336b1c024663cc8fe448fd065'\
        \ and pr['base']['ref'] == 'dyhano/canonical-base-ff7745fb'\nassert os.environ['GITHUB_RUN_ATTEMPT'] ==\
        \ '1'\nassert os.environ['GITHUB_REF'] == f\"refs/pull/{pr['number']}/merge\"\nmerge = git('rev-parse',\
        \ 'HEAD')\nassert merge == os.environ['GITHUB_SHA']\nassert git('show', '-s', '--format=%P', merge).split()\
        \ == [base, head]\nassert git('show', '-s', '--format=%P', head).split() == ['2318eca25a19d3476131fe99340a67a07a9e62b5']\n\
        delta = git('diff-tree', '--no-commit-id', '--name-status', '-r', '2318eca25a19d3476131fe99340a67a07a9e62b5',\
        \ head)\nassert delta == 'A\t.github/workflows/stagea-recovery-ci.yml'\nassert sorted(git('diff', '--name-only',\
        \ base, head).splitlines()) == ['.github/workflows/stagea-recovery-ci.yml', 'agent/stagea_proposal_only.py',\
        \ 'pyproject.toml', 'tests/agent/test_stagea_proposal_only.py']\nassert git('rev-parse', merge + '^{tree}')\
        \ == git('rev-parse', head + '^{tree}')\nreceipt = {'repository': event['repository']['full_name'], 'pr':\
        \ pr['number'], 'head': head, 'base': base, 'merge': merge, 'merge_parents': [base, head], 'merge_tree':\
        \ git('rev-parse', merge + '^{tree}'), 'head_tree': git('rev-parse', head + '^{tree}'), 'workflow_blob':\
        \ git('rev-parse', head + ':.github/workflows/stagea-recovery-ci.yml'), 'run_id': os.environ['GITHUB_RUN_ID'],\
        \ 'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'event': os.environ['GITHUB_EVENT_NAME'], 'action':\
        \ event['action'], 'label': event['label']['name'], 'ref': os.environ['GITHUB_REF'], 'runner_os': os.environ['RUNNER_OS'],\
        \ 'runner_arch': os.environ['RUNNER_ARCH'], 'image_os': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion')}\n\
        Path('stagea-exact-object.json').write_text(json.dumps(receipt, indent=2) + '\\n')\nprint(json.dumps(receipt,\
        \ sort_keys=True))\nPY\n"
    - name: Upload exact object receipt
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: stagea-exact-object
        path: stagea-exact-object.json
        retention-days: 14
        if-no-files-found: error
  detect:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      python: ${{ steps.classify.outputs.python }}
      python_prod: ${{ steps.classify.outputs.python_prod }}
      frontend: ${{ steps.classify.outputs.frontend }}
      site: ${{ steps.classify.outputs.site }}
      scan: ${{ steps.classify.outputs.scan }}
      deps: ${{ steps.classify.outputs.deps }}
      uv_lock: ${{ steps.classify.outputs.uv_lock }}
      npm_lock: ${{ steps.classify.outputs.npm_lock }}
      installer: ${{ steps.classify.outputs.installer }}
      rust: ${{ steps.classify.outputs.rust }}
      docker_meta: ${{ steps.classify.outputs.docker_meta }}
      mcp_catalog: ${{ steps.classify.outputs.mcp_catalog }}
      ci_review: ${{ steps.classify.outputs.ci_review }}
      ci_review_files: ${{ steps.classify.outputs.ci_review_files }}
      event_name: ${{ github.event_name }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Detect affected areas
      id: classify
      uses: ./.github/actions/detect-changes
      with:
        github-token: ${{ github.token }}
    needs: identity
    permissions:
      contents: read
  tests__test:
    name: ${{ github.repository == 'yihangdong/hermes-agent' && format('Run tests {0}/4', matrix.slice) || 'Run
      tests' }}
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(github.repository == 'yihangdong/hermes-agent' && '[1, 2, 3, 4]' || '[1]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Install ripgrep (prebuilt binary)
      run: |
        set -euo pipefail
        RG_VERSION=15.1.0
        RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
        RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
        curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
          "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
        echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
        tar -xzf "$RG_TARBALL"
        sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
        rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
        rg --version
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.9.28
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - name: Set up Python 3.11
      uses: ./.github/actions/retry
      with:
        command: uv python install 3.11
    - name: Install dependencies
      uses: ./.github/actions/retry
      with:
        command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra
          fal --extra modal --extra daytona --extra hindsight --extra parallel-web
    - name: Minimize uv cache
      run: uv cache prune --ci
    - name: Run tests
      run: |
        source .venv/bin/activate
        if [ -n "${CI_TEST_SLICE:-}" ]; then
          scripts/run_tests.sh --slice "$CI_TEST_SLICE"
        else
          scripts/run_tests.sh
        fi
      env:
        HERMES_TEST_WORKERS: ${{ github.repository == 'yihangdong/hermes-agent' && '8' || '96' }}
        CI_TEST_SLICE: ${{ github.repository == 'yihangdong/hermes-agent' && format('{0}/4', matrix.slice) || ''
          }}
        OPENROUTER_API_KEY: ''
        OPENAI_API_KEY: ''
        NOUS_API_KEY: ''
    needs:
    - identity
    - detect
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name
      == 'ci-reviewed' && github.repository == 'yihangdong/hermes-agent') && needs.identity.result == 'success'
      && ((needs.detect.outputs.python == 'true') && (true)) }}
    permissions: &id001
      contents: read
  tests__e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Install ripgrep (prebuilt binary)
      run: |
        set -euo pipefail
        RG_VERSION=15.1.0
        RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
        RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
        curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
          "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
        echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
        tar -xzf "$RG_TARBALL"
        sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
        rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
        rg --version
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.9.28
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - name: Set up Python 3.11
      run: uv python install 3.11
    - name: Install dependencies
      uses: ./.github/actions/retry
      with:
        command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra
          fal --extra modal --extra daytona --extra hindsight --extra parallel-web
    - name: Minimize uv cache
      run: uv cache prune --ci
    - name: Run e2e tests
      run: |
        source .venv/bin/activate
        python -m pytest tests/e2e/ -v --tb=short
      env:
        OPENROUTER_API_KEY: ''
        OPENAI_API_KEY: ''
        NOUS_API_KEY: ''
    needs:
    - identity
    - detect
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name
      == 'ci-reviewed' && github.repository == 'yihangdong/hermes-agent') && needs.identity.result == 'success'
      && ((needs.detect.outputs.python == 'true') && (true)) }}
    permissions: *id001
  tests:
    name: Recovery tests
    needs:
    - identity
    - tests__test
    - tests__e2e
    - detect
    if: ${{ always() && (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name
      == 'ci-reviewed' && github.repository == 'yihangdong/hermes-agent') && needs.identity.result == 'success'
      && (needs.detect.outputs.python == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
    - name: Require every selected child to succeed
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os, sys
        r = {k: v["result"] for k, v in json.loads(os.environ["NEEDS"]).items()}
        print(json.dumps(r, sort_keys=True))
        sys.exit(0 if r and all(v == "success" for v in r.values()) else 1)
        PY
  tests-os__os-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: macOS-only tests
          runner: macos-latest
          marker: macos_only
        - name: Windows-only tests
          runner: windows-latest
          marker: windows_only
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.9.28
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - name: Set up Python 3.11
      uses: ./.github/actions/retry
      with:
        command: uv python install 3.11
    - name: Install dependencies
      uses: ./.github/actions/retry
      with:
        command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra
          fal --extra modal --extra daytona --extra hindsight --extra parallel-web
    - name: Minimize uv cache
      run: uv cache prune --ci
    - name: Run ${{ matrix.marker }} tests
      shell: bash
      run: |
        set -uo pipefail

        LIST="${RUNNER_TEMP:-.}/selected-tests.txt"

        # Process substitution would hide the helper's exit status, so write
        # to a file and check it explicitly.
        if ! uv run --no-sync python scripts/ci/list_os_marked_tests.py \
               "${{ matrix.marker }}" > "$LIST"; then
          echo "::error::could not enumerate ${{ matrix.marker }} test files"
          exit 1
        fi
        if [ ! -s "$LIST" ]; then
          echo "::error::empty ${{ matrix.marker }} file list"
          exit 1
        fi

        # Deliberately NOT `mapfile`: that is a bash 4 builtin and the macOS
        # runner's /bin/bash is 3.2. Word-splitting is safe here because the
        # helper emits repo-relative test paths, which contain no spaces.
        # shellcheck disable=SC2046
        set -- $(cat "$LIST")
        echo "selected $# file(s) for ${{ matrix.marker }}:"
        cat "$LIST"

        # ``shell: bash`` runs this script with ``-e`` injected, which
        # ``set -uo pipefail`` above does not clear. A bare pytest call
        # would therefore abort the script on any non-zero exit and the
        # exit-5 branch below would be unreachable dead code — the job
        # would still fail red, but the diagnostic would never print.
        status=0
        uv run --no-sync python -m pytest \
          "$@" \
          -m "${{ matrix.marker }} and not integration" \
          -v --tb=short || status=$?
        if [ "$status" -eq 5 ]; then
          echo "::error::No tests matched -m ${{ matrix.marker }}. Either the" \
               "marker was renamed/dropped or selection is broken — this job" \
               "must never pass without running its OS's tests."
          exit 1
        fi
        exit "$status"
      env:
        OPENROUTER_API_KEY: ''
        OPENAI_API_KEY: ''
        NOUS_API_KEY: ''
    needs:
    - identity
    - detect
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name
      == 'ci-reviewed' && github.repository == 'yihangdong/hermes-agent') && needs.identity.result == 'success'
      && ((needs.detect.outputs.python == 'true') && (true)) }}
    permissions:
      contents: read
  tests-os:
    name: Recovery tests-os
    needs:
    - identity
    - tests-os__os-tests
    - detect
    if: ${{ always() && (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name
      == 'ci-reviewed' && github.repository == 'yihangdong/hermes-agent') && needs.identity.result == 'success'
      && (needs.detect.outputs.python == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
    - name: Require every selected child to succeed
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os, sys
        r = {k: v["result"] for k, v in json.loads(os.environ["NEEDS"]).items()}
        print(json.dumps(r, sort_keys=True))
        sys.exit(0 if r and all(v == "success" for v in r.values()) else 1)
        PY
  lint__lint-diff:
    name: ruff + ty diff
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name
      == 'ci-reviewed' && github.repository == 'yihangdong/hermes-agent') && needs.identity.result == 'success'
      && ((needs.detect.outputs.python == 'true') && ((needs.detect.outputs.event_name) == 'pull_request')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.9.28
    - name: Install ruff + ty
      uses: ./.github/actions/retry
      with:
        command: uv tool install ruff && uv tool install ty
    - name: Determine base ref
      id: base
      run: |
        # For PRs, diff against the merge base with the target branch.
        # For pushes to main, diff against the previous commit on main.
        if [ "${{ (needs.detect.outputs.event_name) }}" = "pull_request" ]; then
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          BASE_REF="origin/${{ github.base_ref }}"
        else
          BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          BASE_REF="HEAD~1"
        fi
        echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
        echo "ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
        echo "Base SHA: ${BASE_SHA}"
        echo "Base ref: ${BASE_REF}"
    - name: Run ruff + ty on HEAD
      run: |
        mkdir -p .lint-reports/head
        ruff check --output-format json --exit-zero \
          > .lint-reports/head/ruff.json || true
        ty check --output-format gitlab --exit-zero \
          > .lint-reports/head/ty.json || true
        echo "HEAD ruff: $(wc -c < .lint-reports/head/ruff.json) bytes"
        echo "HEAD ty:   $(wc -c < .lint-reports/head/ty.json) bytes"
    - name: Run ruff + ty on base (via git worktree)
      run: |
        mkdir -p .lint-reports/base
        # Use a worktree so we don't clobber the main checkout. If the basex
        # SHA is identical to HEAD (e.g. first commit), skip and leave the
        # base reports empty — the diff script handles missing files.
        HEAD_SHA=$(git rev-parse HEAD)
        BASE_SHA="${{ steps.base.outputs.sha }}"
        if [ "$BASE_SHA" = "$HEAD_SHA" ]; then
          echo "Base SHA == HEAD SHA, skipping base scan."
          echo '[]' > .lint-reports/base/ruff.json
          echo '[]' > .lint-reports/base/ty.json
        else
          git worktree add --detach /tmp/lint-base "$BASE_SHA"
          (
            cd /tmp/lint-base
            ruff check --output-format json --exit-zero \
              > "$GITHUB_WORKSPACE/.lint-reports/base/ruff.json" || true
            ty check --output-format gitlab --exit-zero \
              > "$GITHUB_WORKSPACE/.lint-reports/base/ty.json" || true
          )
          git worktree remove --force /tmp/lint-base
        fi
        echo "base ruff: $(wc -c < .lint-reports/base/ruff.json) bytes"
        echo "base ty:   $(wc -c < .lint-reports/base/ty.json) bytes"
    - name: Generate diff summary
      env:
        HEAD_REF: ${{ (needs.detect.outputs.event_name) == 'pull_request' && github.head_ref || github.ref_name
          }}
      run: |
        python scripts/lint_diff.py \
          --base-ruff .lint-reports/base/ruff.json \
          --head-ruff .lint-reports/head/ruff.json \
          --base-ty   .lint-reports/base/ty.json \
          --head-ty   .lint-reports/head/ty.json \
          --base-ref  "${{ steps.base.outputs.ref }}" \
          --head-ref  "$HEAD_REF" \
          --output    .lint-reports/summary.md
        cat .lint-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
    needs:
    - identity
    - detect
    permissions: &id002
      contents: read
  lint__ruff-blocking:
    name: ruff enforcement (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.9.28
    - name: Install ruff
      uses: ./.github/actions/retry
      with:
        command: uv tool install ruff
    - name: ruff check .
      run: |
        ruff check .
    needs:
    - identity
    - detect
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name
      == 'ci-reviewed' && github.repository == 'yihangdong/hermes-agent') && needs.identity.result == 'success'
      && ((needs.detect.outputs.python == 'true') && (true)) }}
    permissions: *id002
  lint__windows-footguns:
    name: Windows footguns (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.9.28
    - name: Set up Python 3.11
      uses: ./.github/actions/retry
      with:
        command: uv python install 3.11
    - name: Run footgun checker
      run: python scripts/check-windows-footguns.py --all
    needs:
    - identity
    - detect
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name
      == 'ci-reviewed' && github.repository == 'yihangdong/hermes-agent') && needs.identity.result == 'success'
      && ((needs.detect.outputs.python == 'true') && (true)) }}
    permissions: *id002
  lint:
    name: Recovery lint
    needs:
    - identity
    - lint__lint-diff
    - lint__ruff-blocking
    - lint__windows-footguns
    - detect
    if: ${{ always() && (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name
      == 'ci-reviewed' && github.repository == 'yihangdong/hermes-agent') && needs.identity.result == 'success'
      && (needs.detect.outputs.python == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
    - name: Require every selected child to succeed
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os, sys
        r = {k: v["result"] for k, v in json.loads(os.environ["NEEDS"]).items()}
        print(json.dumps(r, sort_keys=True))
        sys.exit(0 if r and all(v == "success" for v in r.values()) else 1)
        PY
  js-tests__check:
    name: JS & TS checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 26
        cache: npm
    - name: grab npm 12
      run: |
        # No-op once the bundled npm is already 12.x — saves ~5-15s/job and
        # keeps the installed major aligned with the npm12 cache-key tag.
        npm --version | grep -q '^12\.' || npm i -g npm@12
    - name: Restore node_modules
      id: node-modules-cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: |
          node_modules
          apps/*/node_modules
